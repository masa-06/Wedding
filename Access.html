<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access</title>
  <!-- 外部CSSファイルのリンク -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="header-placeholder"></div>

  <div class="container">
    <iframe id="map-iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6483.497505614283!2d139.79214757575514!3d35.658561331219026!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x601889a02dff823b%3A0xf980fb24d890af9f!2z44Ki44O044Kh44Oz44K744Oq44Ki44Oz5p2x5Lqs!5e0!3m2!1sja!2sjp!4v1736924565565!5m2!1sja!2sjp" width="300" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    <table id="info-table">
      <tr>
        <th>式場名</th>
        <td>アヴァンセリアン東京</td>
      </tr>
      <tr>
        <th>住所</th>
        <td>〒135-0061 <br> 東京都江東区豊洲３丁目２−３ 豊洲キュービックガーデン1F</td>
      </tr>
      <tr>
        <th>交通アクセス</th>
        <td>電車の場合：<br>
          東京メトロ有楽町線 【豊洲駅】<br>
          1C出口より徒歩3分<br><br>
          新交通ゆりかもめ 【豊洲駅】<br>
          豊洲公園方面出口より徒歩5分</td>
      </tr>
    </table>
  </div>

  <div id="footer-placeholder"></div>
  <script src="js/loadHeader.js"></script>
  <script src="js/loadFooter.js"></script>
  <script>
    // iframeの高さをtableの高さに合わせる
    window.onload = function() {
      var iframe = document.getElementById('map-iframe');
      var table = document.getElementById('info-table');
      iframe.style.height = table.offsetHeight + 'px';
    };
  </script>
</body>

</html>
